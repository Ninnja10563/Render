name: Publish release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching VERSION (without v)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: render-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify version and tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$RELEASE_VERSION" = "$(cat VERSION)"
          test "$(git rev-list -n 1 "v$RELEASE_VERSION")" = "$(git rev-parse HEAD)"
          test -f "docs/releases/$RELEASE_VERSION.md"
      - run: swift build --arch arm64
      - run: swift test --arch arm64
      - run: scripts/package.sh
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" --verify-tag --title "Render $RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_VERSION.md" --prerelease "dist/Render-$RELEASE_VERSION-Apple-Silicon.dmg" "dist/Render-$RELEASE_VERSION-Apple-Silicon.dmg.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation
          path: |
            build/workspace*.png
            build/launch.log
